<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Printable Shopping List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            color: #000;
        }
        h1 {
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
        }
        .category-title {
            font-size: 20px;
            color: #333;
            margin-top: 25px;
            margin-bottom: 10px;
            padding-bottom: 5px;
            border-bottom: 1px solid #ccc;
        }
        .shopping-list {
            list-style-type: none;
            padding: 0;
            margin-top: 20px;
        }
        .shopping-list li {
            font-size: 16px;
            line-height: 1.6;
            padding: 10px 0 10px 35px; /* Add padding for the checkbox */
            position: relative;
            border-bottom: 1px solid #ddd;
        }
        .shopping-list li:last-child {
            border-bottom: none;
        }
        .shopping-list li::before {
            content: '';
            position: absolute;
            left: 0;
            top: 12px; /* Adjust vertical alignment */
            width: 18px;
            height: 18px;
            border: 2px solid #555;
            border-radius: 3px;
        }
        @media print {
            .button-container {
                display: none;
            }
        }
        .button-container {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }
        .print-button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        .back-button {
            padding: 10px 20px;
            background-color: #616161; /* A neutral grey */
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <h1>Shopping List</h1>
    <div class="button-container">
        <button onclick="window.print()" class="print-button">Print List</button>
        <a href="/meal-plan" class="back-button">Back to Meal Planner</a>
    </div>
    <div class="shopping-list-container">
        {{range .ShoppingList}}
            {{if .Ingredients}}
            <h2 class="category-title">{{.CategoryName}}</h2>
            <ul class="shopping-list">
                {{range .Ingredients}}
                <li>
                    {{.Name}}{{if .Amount}} x {{.Amount}}{{if .Unit}} {{.Unit}}{{end}}{{end}}
                </li>
                {{end}}
            </ul>
            {{end}}
        {{else}}
        <p>Your shopping list is empty.</p>
        {{end}}
    </div>
</body>
</html>
